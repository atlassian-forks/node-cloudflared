name: Release

on:
    push:
        branches:
            - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        name: Release (${{ github.ref }})
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            # Needed by artifact-publish-token to get temporary Artifactory credentials.
            id-token: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup PNPM
              uses: pnpm/action-setup@v6
              with:
                  run_install: true

            - name: Build
              run: pnpm build

            # Publishing goes to Atlassian's Artifactory (see publishConfig in
            # package.json), which forwards the package to npmjs.
            - name: Get Artifact Publish Token
              uses: atlassian-labs/artifact-publish-token@v1.0.1
              with:
                  output-modes: npm

            # The action writes ./.npmrc-public, which reads the credentials from
            # environment variables. Move it to the user config so pnpm uses it and
            # it can't be committed into the release pull request.
            - name: Configure Artifactory credentials
              run: |
                  cat .npmrc-public >> ~/.npmrc
                  rm .npmrc-public

            - name: Create Release Pull Request or Publish to NPM
              id: changesets
              uses: changesets/action@v1
              with:
                  publish: pnpm changeset publish
                  version: pnpm changeset version
                  title: Release Packages
                  commit: bump versions
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
